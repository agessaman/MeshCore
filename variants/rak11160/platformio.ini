[rak11160]
extends = stm32_base
board = rak3172
board_upload.maximum_size = 229376 ; 32kb for FS
build_flags = ${stm32_base.build_flags}
  -D RAK_11160
  -D RADIO_CLASS=CustomSTM32WLx
  -D WRAPPER_CLASS=CustomSTM32WLxWrapper
  -D SPI_INTERFACES_COUNT=0
  -D RX_BOOSTED_GAIN=true
;  -D STM32WL_TCXO_VOLTAGE=1.8 ; defaults to 1.8
  -I variants/rak11160
build_src_filter = ${stm32_base.build_src_filter}
  +<../variants/rak11160>

[env:RAK_11160_repeater]
extends = rak11160
build_flags = ${rak11160.build_flags}
  -D ADVERT_NAME='"RAK11160 Repeater"'
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
build_src_filter = ${rak11160.build_src_filter}
  +<../examples/simple_repeater/*.cpp>

[env:RAK_11160_sensor]
extends = rak11160
build_flags = ${rak11160.build_flags}
  -D ADVERT_NAME='"RAK11160 Sensor"'
  -D ADMIN_PASSWORD='"password"'
build_src_filter = ${rak11160.build_src_filter}
  +<../examples/simple_sensor>

[env:RAK_11160_companion_radio_usb]
extends = rak11160
build_flags = ${rak11160.build_flags}
  -D MAX_CONTACTS=100
  -D MAX_GROUP_CHANNELS=8
  -D ENABLE_USB_INTERFACE
build_src_filter = ${rak11160.build_src_filter}
  +<../examples/companion_radio/*.cpp>
lib_deps = ${rak11160.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:RAK_11160_kiss_modem]
extends = rak11160
build_src_filter = ${rak11160.build_src_filter}
  +<../examples/kiss_modem/>
