[rpi_picow]
extends = rp2040_base
board = rpipicow
board_build.core = earlephilhower
board_build.filesystem_size = 0.5m
build_flags = ${rp2040_base.build_flags}
  -I variants/rpi_picow
;  -D PICOW
;  -D HW_SPI1_DEVICE
  -D P_LORA_DIO_1=20
  -D P_LORA_NSS=3
  -D P_LORA_RESET=15
  -D P_LORA_BUSY=2
  -D P_LORA_SCLK=10
  -D P_LORA_MISO=12
  -D P_LORA_MOSI=11
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=130
  -D SX126X_RX_BOOSTED_GAIN=1
  -D LORA_TX_POWER=22
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
build_src_filter = ${rp2040_base.build_src_filter}
  +<PicoWBoard.cpp>
  +<../variants/rpi_picow>
lib_deps = ${rp2040_base.lib_deps}

[env:PicoW_repeater]
extends = rpi_picow
build_flags = ${rpi_picow.build_flags}
  -D ADVERT_NAME='"PicoW Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${rpi_picow.build_src_filter}
  +<../examples/simple_repeater>

[pico_observer_base]
extends = rpi_picow
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#a1df30f0ad7cd1ac389d01701ac36ac917770be8
platform_packages =
  framework-arduinopico @ https://github.com/earlephilhower/arduino-pico.git#0affea4db5dbcd4a43568784acb4858c4786f1a9
build_flags = ${rpi_picow.build_flags}
  -D PIO_FRAMEWORK_ARDUINO_ENABLE_FREERTOS
lib_ignore = PsychicMqttClient, BLE
lib_deps = ${rpi_picow.lib_deps}
  256dpi/MQTT @ 2.5.3
  links2004/WebSockets @ 2.7.2
  JChristensen/Timezone @ 1.2.5
  paulstoffregen/Time @ 1.6.1

[env:PicoW_mqtt_transport_probe]
extends = pico_observer_base
lib_deps =
  256dpi/MQTT @ 2.5.3
  links2004/WebSockets @ 2.7.2
build_src_filter =
  -<*>
  +<../examples/pico_mqtt_transport_probe/main.cpp>

[env:PicoW_repeater_observer_mqtt_experimental]
extends = pico_observer_base
lib_deps =
  ${pico_observer_base.lib_deps}
  bblanchon/ArduinoJson @ 7.4.3
extra_scripts = pre:scripts/pico_observer_transport.py
build_flags = ${pico_observer_base.build_flags}
  -D PICO_MQTT_OBSERVER=1
  -D FIRMWARE_VERSION='"v1.18.0-pico-dhcp2"'
  -D WITH_MQTT_BRIDGE=1
  -D MQTT_DEFAULT_SLOT2_PRESET='"none"'
  -D WEBSOCKETS_MAX_DATA_SIZE=2048
  -D MAX_NEIGHBOURS=10
  -D ADVERT_NAME='"Pico W Observer"'
build_src_filter = ${rpi_picow.build_src_filter}
  +<helpers/mqtt/*.cpp>
  +<helpers/rp2040/PicoWifiNetworkLink.cpp>
  +<helpers/bridges/PicoMQTTBridge.cpp>
  +<helpers/MQTTMessageBuilder.cpp>
  +<helpers/JWTHelper.cpp>
  +<../examples/simple_repeater>

[env:PicoW_room_server]
extends = rpi_picow
build_flags = ${rpi_picow.build_flags}
  -D ADVERT_NAME='"Test Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${rpi_picow.build_src_filter}
  +<../examples/simple_room_server>

[env:PicoW_companion_radio_usb]
extends = rpi_picow
build_flags = ${rpi_picow.build_flags}
  -D MAX_CONTACTS=100
  -D MAX_GROUP_CHANNELS=8
  -D ENABLE_USB_INTERFACE
; NOTE: DO NOT ENABLE -->  -D MESH_PACKET_LOGGING=1
; NOTE: DO NOT ENABLE -->  -D MESH_DEBUG=1
build_src_filter = ${rpi_picow.build_src_filter}
  +<../examples/companion_radio/*.cpp>
lib_deps = ${rpi_picow.lib_deps}
  densaugeo/base64 @ ~1.4.0
lib_ignore = PsychicMqttClient, BLE

[env:PicoW_companion_radio_ble]
extends = rpi_picow
build_flags = ${rpi_picow.build_flags}
  -D MAX_CONTACTS=100
  -D MAX_GROUP_CHANNELS=8
  -D PIO_FRAMEWORK_ARDUINO_ENABLE_BLUETOOTH
  -D BLE_PIN_CODE=123456
  -D BLE_DEBUG_LOGGING=1
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${rpi_picow.build_src_filter}
  +<helpers/rp2040/SerialBLEInterface.cpp>
  +<../examples/companion_radio/*.cpp>
lib_deps = ${rpi_picow.lib_deps}
  densaugeo/base64 @ ~1.4.0

; USB + WiFi + BLE together; the interface manager fans frames out to all of them
[env:PicoW_companion_radio]
extends = rpi_picow
build_flags = ${rpi_picow.build_flags}
  -D MAX_CONTACTS=100
  -D MAX_GROUP_CHANNELS=8
  -D ENABLE_USB_INTERFACE
  -D ENABLE_WIFI_INTERFACE
  -D PIO_FRAMEWORK_ARDUINO_ENABLE_BLUETOOTH
  -D BLE_PIN_CODE=123456
; NOTE: DO NOT ENABLE -->  -D BLE_DEBUG_LOGGING=1   (shares Serial with the USB interface)
; NOTE: DO NOT ENABLE -->  -D WIFI_DEBUG_LOGGING=1
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${rpi_picow.build_src_filter}
  +<helpers/rp2040/SerialBLEInterface.cpp>
  +<helpers/wifi/*.cpp>
  +<../examples/companion_radio/*.cpp>
lib_deps = ${rpi_picow.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:PicoW_companion_radio_wifi]
extends = rpi_picow
build_flags = ${rpi_picow.build_flags}
  -D ENABLE_WIFI_INTERFACE
  -D MAX_CONTACTS=100
  -D MAX_GROUP_CHANNELS=8
  -D WIFI_DEBUG_LOGGING=1
  -D WIFI_SSID='""'   ; no default network, configure with 'set wifi.ssid' / 'set wifi.pwd'
  -D WIFI_PWD='""'
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${rpi_picow.build_src_filter}
  +<helpers/wifi/*.cpp>
  +<../examples/companion_radio/*.cpp>
lib_deps = ${rpi_picow.lib_deps}
  densaugeo/base64 @ ~1.4.0
lib_ignore = PsychicMqttClient, BLE

[env:PicoW_terminal_chat]
extends = rpi_picow
build_flags = ${rpi_picow.build_flags}
  -D MAX_CONTACTS=100
  -D MAX_GROUP_CHANNELS=1
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${rpi_picow.build_src_filter}
  +<../examples/simple_secure_chat/main.cpp>
lib_deps = ${rpi_picow.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:PicoW_kiss_modem]
extends = rpi_picow
build_src_filter = ${rpi_picow.build_src_filter}
  +<../examples/kiss_modem/>
