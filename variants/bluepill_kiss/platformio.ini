; EBYTE E22P-915MBH-SC evaluation kit: STM32F103C8T6 + E22P-915M30S (SX1262, 30 dBm PA).
; Minimal KISS TNC, no crypto/identity/filesystem.
; Pin map taken directly from the kit schematic (E22(220)-400(900)MBH-SC).
[bluepill_kiss]
extends = stm32_base
board = genericSTM32F103C8
build_flags = ${stm32_base.build_flags}
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D KISS_NO_CRYPTO=1
  ; --- SX1262 wiring (SPI1: SCK PA5 / MISO PA6 / MOSI PA7) ---
  -D P_LORA_NSS=PA4
  -D P_LORA_DIO_1=PA3
  -D P_LORA_BUSY=PB1
  -D P_LORA_RESET=PB0
  ; --- RF switch: E22 PA/LNA controlled by TXEN/RXEN (DIO2 NOT used as switch) ---
  ; PB13 is the E22P EN line: forced HIGH in BluePillBoard::begin(), NOT driven by
  ; RadioLib. Leaving SX126X_RXEN=PB13 defined would make RadioLib toggle it as RX-
  ; enable and fight the forced-HIGH, so it stays commented. TXEN=PB12 still switches TX.
  ; -D SX126X_RXEN=PB13
  -D SX126X_TXEN=PB12
  ; --- E22 module has a TCXO on DIO3 ---
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D RX_BOOSTED_GAIN=true
  ; --- Onboard indicator LEDs (E22P eval kit): LED3 TXD=PA15, LED2 RXD=PB6, both
  ;     active-low. (PWR LED is tied to GND, not controllable.) ---
  ; DIAGNOSTIC: reuse the RXD LED (PB6) as a liveness heartbeat, toggled from the top
  ; of loop() in main.cpp. Blinks iff loop() is iterating: a frozen LED means loop()
  ; is hung (MCU/radio blocking call); still blinking while the modem is stuck points
  ; at a USB-TX/serial stall instead. PB6 is a clean GPIO; PA15 is avoided here because
  ; it is the JTDI (JTAG) pin and needs JTAG disabled before use as GPIO.
  -D KISS_HEARTBEAT_LED=PB6
  -D KISS_HEARTBEAT_INTERVAL_MS=250
  ; Real TX-activity LED is PA15 (not PC13); disabled while the heartbeat is active.
  ; -D P_LORA_TX_LED=PA15
  ; Watchdog: self-recover if loop() wedges (e.g. RadioLib's unbounded BUSY-wait on
  ; TX entry). ~4s; reset MCU re-inits the modem instead of staying frozen.
  ; A HardFault fast-blinks the heartbeat LED until this reset fires, so the two
  ; hang classes are visually distinct (fast blink = fault, solid = BUSY spin).
  -D KISS_WATCHDOG_MS=4000
  ; --- 915 MHz module (US band); tune to taste ---
  -D LORA_FREQ=915.0
  ; WARNING: this is a 30 dBm (1W) PA module. LORA_TX_POWER sets the *SX1262*
  ; drive level, which the external PA amplifies. Set per Ebyte's PA spec;
  ; over-driving can exceed legal limits / overheat the module.
  -D LORA_TX_POWER=2
  -I variants/bluepill_kiss
build_src_filter = ${stm32_base.build_src_filter}
  +<../variants/bluepill_kiss>
  ; STM32F1 has no SHUTDOWN-mode flash FS; KISS_NO_CRYPTO never uses it.
  -<helpers/stm32/InternalFileSystem.cpp>

; ---- KISS over the broken-out USART1 header (PA9 TX / PA10 RX) ----
[env:bluepill_kiss_modem]
extends = bluepill_kiss
build_flags = ${bluepill_kiss.build_flags}
  ; All-or-nothing KISS writes need availableForWrite() to report a whole escaped
  ; frame (~514B). UART drains at baud so this rarely fills; just size it to fit.
  -D SERIAL_TX_BUFFER_SIZE=1024
build_src_filter = ${bluepill_kiss.build_src_filter}
  +<../examples/kiss_modem/>

; ---- KISS over the Type-C native USB (CDC); fit is tighter ----
[env:bluepill_kiss_modem_usb]
extends = bluepill_kiss
build_flags = ${bluepill_kiss.build_flags}
  -D USBCON
  -D USBD_USE_CDC
  -D USBD_VID=0x0483
  -D USBD_PID=0x5740
  ; STM32 USBSerial::write() busy-spins while connected if the host stops draining,
  ; wedging loop() permanently. All-or-nothing writes (availableForWrite guard) avoid
  ; that, but the default CDC TX queue is only 64*2=128B and would drop every large RX
  ; frame. Bump to 64*24=1536B: fits a whole escaped frame (~514B) with headroom to
  ; absorb longer host read gaps before TX_DONE/replies get squeezed. (#ifndef-guarded.)
  -D CDC_TRANSMIT_QUEUE_BUFFER_PACKET_NUMBER=24
  ; The default 3-packet (192B) CDC receive ring fills mid-burst on a large host->modem
  ; KISS frame (~5 back-to-back 64B USB packets), forcing pause/resume of reception from
  ; the MAIN thread, which races the USB ISR in CDC_ReceiveQueue_ReserveBlock and can hand
  ; the endpoint a torn block pointer -> USB_ReadPMA writes out of bounds -> HardFault
  ; (captured on hardware: imprecise bus fault, pc in USB_ReadPMA, lr in USB IRQ handler).
  ; 16 packets (1024B) holds the largest single-flight KISS exchange, so the queue never
  ; fills, reception is only ever re-armed from the ISR, and the racy path never runs.
  -D CDC_RECEIVE_QUEUE_BUFFER_PACKET_NUMBER=16
  -flto
build_unflags = -fno-lto
build_src_filter = ${bluepill_kiss.build_src_filter}
  +<../examples/kiss_modem/>
